name: Solana Runner Tracker

on:
  schedule:
    # UTC times. Summer (Paris = UTC+2): 06:00 → 08:00 CET, 20:00 → 22:00 CET.
    # Winter (Paris = UTC+1), shift by one hour: use 07:00 and 21:00.
    - cron: "0 6 * * *"
    - cron: "0 20 * * *"
  workflow_dispatch:        # "Run workflow" button for on-demand runs

permissions:
  contents: write           # needed to write back the calibration history
  pages: write
  id-token: write

concurrency:
  group: tracker
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0    # full history, so the merge below can resolve

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Pick the run type
        id: kind
        run: |
          if [ "${{ github.event.schedule }}" = "0 20 * * *" ]; then
            echo "run=evening" >> "$GITHUB_OUTPUT"
          else
            echo "run=morning" >> "$GITHUB_OUTPUT"
          fi

      - name: Run the tracker
        env:
          HELIUS_API_KEY: ${{ secrets.HELIUS_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python src/main.py --run ${{ steps.kind.outputs.run }}

      - name: Archive the report
        uses: actions/upload-artifact@v4
        with:
          name: report-${{ steps.kind.outputs.run }}
          path: out/
          retention-days: 30

      # Publishing comes before persistence on purpose: getting the report onto
      # the page is the job. A hiccup writing history back must never be able to
      # stop the site from updating.
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out
      - uses: actions/deploy-pages@v4

      - name: Persist history and calibration
        continue-on-error: true    # never fail the run over a git race
        run: |
          set -u
          git config user.name  "tracker-bot"
          git config user.email "tracker-bot@users.noreply.github.com"
          git add -A data out
          if git diff --staged --quiet; then
            echo "nothing new to persist"
            exit 0
          fi
          git commit -m "run ${{ steps.kind.outputs.run }} $(date -u +%F_%H:%M)"

          # data/ and out/ are regenerated every run, so whenever the remote has
          # moved on, the freshly produced files are the ones that should win.
          # A rebase would stop and ask a human; -X ours resolves and continues.
          for attempt in 1 2 3; do
            git fetch origin "$GITHUB_REF_NAME" || true
            if ! git merge -X ours "origin/$GITHUB_REF_NAME" \
                   -m "merge remote before publishing run output"; then
              git merge --abort || true
              echo "merge attempt $attempt failed, retrying"
              sleep 5
              continue
            fi
            if git push origin "HEAD:$GITHUB_REF_NAME"; then
              echo "history persisted on attempt $attempt"
              exit 0
            fi
            echo "push attempt $attempt rejected, retrying"
            sleep 5
          done
          echo "could not persist history this run — the report was still published"
          exit 1
